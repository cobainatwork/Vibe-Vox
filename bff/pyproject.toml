[project]
name = "vibe-vox-bff"
version = "0.1.0"
description = "Vibe-Vox BFF：ASR/TTS 測試與管理平台的薄應用後端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "opencc-python-reimplemented>=0.1.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibe_vox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 讓 `from fakes import ...` 穩固。不寫的話它只靠 pytest 預設 import mode 把 tests/
# 推上 sys.path，而那個行為的前提是「tests/ 無 __init__.py」——有人加了它，或改用
# importmode=importlib，共用替身就會 ModuleNotFoundError。
pythonpath = ["tests"]
