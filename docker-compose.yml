# Vibe-Vox 正式版編排：五部署單元，vLLM、aligner 與 TTS 共用單張 GPU
# （ADR-0004：三模型常駐 RTX 6000 Ada 48GB）。
#
# 2026-08-07 首次實測三個模型同時常駐 GPU 0：起得來（各服務實佔見 #31）。但那是**閒置
# 常駐**的讀數，`nvidia-smi` 當下 GPU-Util 0%，三者同時推論未測。ADR 的 VRAM 帳仍有兩項
# 已知錯誤（實際是兩張卡、第二張被別的專案動態佔用；VoxCPM2 的 ~8 GiB 是估算非實測），
# 校準歸 #31。

services:
  bff:
    build:
      context: ./bff
    environment:
      VIBE_VOX_FRONTEND_ORIGINS: "http://localhost"
      VIBE_VOX_ASR_BASE_URL: "http://vllm:8000"
      VIBE_VOX_ALIGNER_BASE_URL: "http://aligner:9100"
      # 埠須與 tts 服務 command 的 --port 一致（vLLM serve 預設 8000）。
      VIBE_VOX_TTS_BASE_URL: "http://tts:8000"
      # **同一個表示式必須寫在 bff 與 aligner 兩處**，由 .env 單點覆寫，兩邊才不會分歧
      # （分歧的症狀見 bff/src/vibe_vox/adapters/aligner.py 的 DEFAULT_MAX_BATCH_ITEMS）。
      # bff/tests/test_config.py 會讀本檔確認兩處都佈線且值相同。
      VIBE_VOX_ALIGNER_MAX_BATCH_ITEMS: "${VIBE_VOX_ALIGNER_MAX_BATCH_ITEMS:-8}"
    volumes:
      # SQLite 單檔與音色參考音的家。不掛則資料只在容器可寫層，起新容器即遺失
      # （#33，見 docs/spec.md 的「持久化」）。掛載點與 VIBE_VOX_DB_PATH、
      # VIBE_VOX_VOICE_DIR 定義於 bff/Dockerfile。
      # **不要在此覆寫那兩個路徑**：指到 /data 之外會讓資料靜默回到可寫層，
      # volume 照掛但沒人用，且不會報錯。
      - bff_data:/data
    depends_on:
      # 刻意只依賴 vllm。aligner 不列入：它不可用時 ASR 逐字稿仍須照常回傳，
      # 硬依賴會讓 ADR-0004 的第二層降級失效。
      vllm:
        condition: service_started
    networks:
      - vibe
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8088:8080"
    depends_on:
      - bff
    networks:
      - vibe
    restart: unless-stopped

  vllm:
    # VibeVoice-ASR：官方 vllm_plugin + 權重 build 時 bake 進 image（開箱即用）。
    # 見 docker/vllm.Dockerfile；serve 由官方 start_server.py 處理（served-model-name vibevoice）。
    build:
      context: .
      dockerfile: docker/vllm.Dockerfile
    # **三個記憶體參數必須顯式列在這裡。** 不列的後果不是「用了不好的值」，而是那三個值
    # 寫在 image 內的上游 start_server.py 裡、連 grep 都找不到，而 ADR-0001 至今仍寫著
    # utilization 該壓到 0.55–0.6。這與 #35 的 nginx 預設 60 秒是同一個失效模式。
    # 取值依據見 .env.example，歷次量測見 #31；不變量由 bff/tests/test_config.py 守著。
    command:
      - python3
      - /app/vllm_plugin/scripts/start_server.py
      - --max-model-len
      - "${VIBE_VOX_VLLM_MAX_MODEL_LEN:-24576}"
      - --max-num-seqs
      - "${VIBE_VOX_VLLM_MAX_NUM_SEQS:-8}"
      - --gpu-memory-utilization
      # 0.65 而非 0.70：2026-08-07 實測 0.70 之下 tts 服務起不到（VoxCPM2 在啟動期因
      # free memory 不足被拒），0.65 才三者共存。詳見 .env.example 同名項目。
      - "${VIBE_VOX_VLLM_GPU_MEMORY_UTILIZATION:-0.65}"
    ipc: host   # vLLM 需要（官方 docker run 用 --ipc=host）
    networks:
      - vibe
    restart: unless-stopped
    deploy: &gpu_deploy
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]  # 釘選同一張卡，符 ADR-0001 共用單卡 VRAM 協調
              capabilities: [gpu]

  aligner:
    # 字級強制對齊（ADR-0004 的第四部署單元）：Qwen3-ForcedAligner-0.6B，
    # transformers backend，與 vllm 容器完全隔離（不共用 image、不改其 Dockerfile）。
    # 刻意不列入 bff 的 depends_on：aligner 不可用時 ASR 逐字稿仍須照常回傳，
    # 硬依賴會讓這層降級失效。
    build:
      context: .
      dockerfile: docker/aligner.Dockerfile
    environment:
      # 與 bff 同一個表示式，理由見該處註解（#36）。
      VIBE_VOX_ALIGNER_MAX_BATCH_ITEMS: "${VIBE_VOX_ALIGNER_MAX_BATCH_ITEMS:-8}"
    networks:
      - vibe
    restart: unless-stopped
    deploy: *gpu_deploy

  tts:
    # vLLM-Omni 承載 VoxCPM2。見 docker/tts.Dockerfile。
    # 三個模型 2026-08-07 實測可同時常駐 GPU 0（#31），但**仍留在 tts profile、預設
    # 不啟動**：它實佔 7952 MiB 而 ASR 測試不需要它（bff 在 VIBE_VOX_USE_STUB_MODELS=true
    # 下走 stub），且三者同時在位時 nvidia-smi 只剩 2659 MiB。
    profiles: ["tts"]
    build:
      context: .
      dockerfile: docker/tts.Dockerfile
    # **記憶體參數顯式列出**，理由同 vllm 服務。但兩者的機制不同：utilization 是
    # per-instance 上限而非全卡瓜分（傳輸 findings §3.1.6），真正的約束是「啟動當下的
    # free memory ≥ total × 自己的 utilization」，不夠就在啟動期明確拒絕。
    #
    # 2026-08-07 實測：這兩個值在 ASR 降到 0.65 之後起得來，行程實佔 7952 MiB。但**尚未
    # 打過合成請求**，推論期的峰值未知，故仍非校準結果——取值依據與量測的限制見
    # .env.example 同名項目。上游 voxcpm2.yaml 的預設（utilization 0.9、KV 6 GiB）在本機
    # 一定起不來，因為 ASR 的 vLLM 已佔住大半張卡。
    command:
      - vllm
      - serve
      - openbmb/VoxCPM2
      - --omni
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --gpu-memory-utilization
      - "${VIBE_VOX_TTS_GPU_MEMORY_UTILIZATION:-0.17}"
      - --kv-cache-memory-bytes
      - "${VIBE_VOX_TTS_KV_CACHE_BYTES:-1073741824}"
    ipc: host   # 同 vllm 服務
    networks:
      - vibe
    restart: unless-stopped
    deploy: *gpu_deploy

networks:
  vibe:
    driver: bridge

volumes:
  # 具名 volume 而非 bind mount：資料由 Docker 管理，不依賴宿主的目錄結構與權限。
  # 注意實際名稱是 `<project>_bff_data`，而 project 名預設取自本目錄名——搬動 repo
  # 或設 COMPOSE_PROJECT_NAME 會指向另一個（空的）volume。
  bff_data:
