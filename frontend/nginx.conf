server {
    listen 8080;
    server_name _;

    # /api 反向代理至 BFF。以 resolver + 變數 upstream 將解析延到請求時，
    # 經 Docker 內嵌 DNS（127.0.0.11）解析，避免啟動時 bff 未就緒即崩潰，
    # 亦能跟上 bff 容器重啟後的新 IP（字面 upstream 會永久快取舊 IP）。
    location /api/ {
        # ASR 音檔上傳可達數十~上百 MB；nginx 預設 1m 太小。
        # 設 210m 略大於 BFF 的 audio_max_bytes(200MB)，讓超限回 BFF 友善 413 而非 nginx 硬擋。
        client_max_body_size 210m;

        # **未設時 nginx 預設 60 秒**，而那曾使音檔長度的實際上限只有約 5 分鐘，遠小於
        # 文件當時記載的模型上限且無任何提示：10 分鐘的會議錄音回 504，而 vLLM 當下仍
        # 在生成（#35）。
        #
        # 此值必須大於 BFF 的 heavy_request_budget（三個子系統逾時之和乘餘裕，預設
        # 504 秒），否則使用者拿到 nginx 的 HTML 錯誤頁而非 BFF 的 JSON 錯誤信封。
        # `bff/tests/test_config.py` 的 test_reverse_proxy_timeout_exceeds_heavy_guard
        # 會實際讀取本檔比對，改這裡或改 bff 的逾時，那條測試都會紅。
        #
        # send／client_body 一併設：它們管的是讀寫之間的閒置逾時，大檔上傳雖不會單靠
        # 總量撞上 60 秒，但慢速連線的長時間停頓會。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 600s;

        resolver 127.0.0.11 ipv6=off valid=10s;
        set $bff_upstream bff:8000;
        proxy_pass http://$bff_upstream;
        # 用 $http_host（保留 host:port）而非 $host（會剝掉 port）：BFF 的 OriginGuard
        # 以「Origin == Host」判定同源，Origin 帶 port，Host 也必須帶 port 才對得上。
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
