# Vibe-Vox dev 編排：無 GPU 工作機用。僅 BFF 與前端，BFF 預設即以 stub
# adapter 啟動（真實 AsrClient/TtsClient 於 #2/#4 落地），故無需 vLLM/TTS。

services:
  bff:
    build:
      context: ./bff
    environment:
      VIBE_VOX_FRONTEND_ORIGINS: "http://localhost:5173"
      VIBE_VOX_USE_STUB_MODELS: "true"
    volumes:
      # 與正式版同理（#33）。刻意與 prod 的 bff_data 分名：兩份 compose 同目錄即同
      # project 名，同名會讓 dev 的測試資料流進正式資料。
      - bff_dev_data:/data
    ports:
      - "8000:8000"
    networks:
      - vibe-dev

  frontend:
    image: node:24-alpine
    working_dir: /app
    environment:
      VITE_BFF_TARGET: "http://bff:8000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - bff
    networks:
      - vibe-dev

networks:
  vibe-dev:
    driver: bridge

volumes:
  frontend_node_modules:
  bff_dev_data:
